<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlueBox</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>
  <div class="chat-container">
    <header>
      <img src="/static/IMG_2172.png" class="logo" alt="BlueBox Logo">
      <h1>BlueBox</h1>
      <button id="theme-toggle">🌙</button>
    </header>

    <div id="preload-questions">
      <p>Popular Topics:</p>
      <button onclick="sendPreloaded('What is the admission process?')">Admission</button>
      <button onclick="sendPreloaded('Best private colleges in India')">Top Colleges</button>
      <button onclick="sendPreloaded('Hostel facilities available?')">Hostels</button>
      <button onclick="sendPreloaded('What are the fees?')">Fees</button>
      <button onclick="sendPreloaded('What scholarships are available?')">Scholarships</button>
    </div>

    <div class="chat-window" id="chat-window"></div>

    <div class="typing-indicator" id="typing-indicator" style="display: none;">BlueBox is typing...</div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
      <button onclick="startVoiceInput()">🎤</button>
      <button onclick="resetChat()">Reset</button>
    </div>

    <footer>
      <p>Contact us: <a href="mailto:bluebox2703@gmail.com">bluebox2703@gmail.com</a></p>
      <div id="google_translate_element"></div>
    </footer>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const typingIndicator = document.getElementById('typing-indicator');

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
    }

    function appendMessage(sender, text) {
      const container = document.createElement('div');
      container.classList.add('message', sender);

      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.src = sender === 'user' ? '/static/IMG_2175.png' : '/static/IMG_2172.png';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = text;

      container.appendChild(avatar);
      container.appendChild(bubble);
      chatWindow.appendChild(container);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      if (sender === 'bot') {
        speak(text);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      appendMessage('user', message);
      input.value = '';
      typingIndicator.style.display = 'block';

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await response.json();
      typingIndicator.style.display = 'none';
      appendMessage('bot', data.reply);
    }

    function sendPreloaded(text) {
      document.getElementById('user-input').value = text;
      sendMessage();
    }

    function resetChat() {
      chatWindow.innerHTML = '';
    }

    function startVoiceInput() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-IN';
      recognition.onresult = event => {
        document.getElementById('user-input').value = event.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }

    function speak(text) {
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'en-IN';
      speechSynthesis.speak(msg);
    }

    // Dark Mode Toggle
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.onclick = () => {
      document.body.classList.toggle('dark');
      toggleBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    };
  </script>
</body>
</html>
