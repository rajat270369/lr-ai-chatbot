<!DOCTYPE html>
<html>
<head>
  <title>BlueBox – College AI Chatbot</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <h1>🎓 BlueBox</h1>
      <p id="welcomeText">Loading...</p>
    </div>

    <div id="chatbox" class="chatbox"></div>

    <div id="typingIndicator" class="typing hidden">
      <img src="/static/bot-avatar.png" class="avatar" />
      <span>BlueBox is typing...</span>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question..." />
      <button onclick="sendMessage()">➤</button>
    </div>

    <div class="contact">
      Contact us at <a href="mailto:bluebox2703@gmail.com">bluebox2703@gmail.com</a>
    </div>
  </div>

  <script>
    function askName() {
      let username = localStorage.getItem("bluebox_name");
      if (!username) {
        username = prompt("Hi! What’s your name?");
        if (username) {
          localStorage.setItem("bluebox_name", username);
        }
      }

      const welcomeText = document.getElementById("welcomeText");
      welcomeText.innerHTML = username
        ? `👋 Hi, <strong>${username}</strong>! How can I help you today?`
        : `👋 Hello! How can I help you today?`;
    }

    askName();

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      const chatbox = document.getElementById("chatbox");
      const typing = document.getElementById("typingIndicator");

      chatbox.innerHTML += `
        <div class="message user">
          <img src="/static/user-avatar.png" class="avatar" />
          <div class="bubble"><b>You:</b> ${message}</div>
        </div>
      `;
      input.value = "";
      typing.classList.remove("hidden");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        typing.classList.add("hidden");

        chatbox.innerHTML += `
          <div class="message bot">
            <img src="/static/bot-avatar.png" class="avatar" />
            <div class="bubble"><b>BlueBox:</b> ${data.response}</div>
          </div>
        `;
      } catch (err) {
        typing.classList.add("hidden");
        chatbox.innerHTML += `
          <div class="message bot error">
            <img src="/static/bot-avatar.png" class="avatar" />
            <div class="bubble">Bot: Error contacting server.</div>
          </div>
        `;
      }

      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
