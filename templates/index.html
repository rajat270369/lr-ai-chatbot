<!DOCTYPE html>
<html>
<head>
  <title>BlueBox – College AI Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/static/IMG_2172.png" alt="BlueBox Logo" class="bot-avatar logo">
      <h1>BlueBox</h1>
    </div>
    <p class="tagline">Your personal college assistant. Ask anything!</p>

    <div id="chatbox" class="chatbox"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type a question..." autofocus />
      <button onclick="sendMessage()">Send</button>
    </div>

    <p class="contact">Contact: <a href="mailto:bluebox2703@gmail.com">bluebox2703@gmail.com</a></p>
  </div>

  <script>
    let userName = "";

    window.onload = () => {
      userName = prompt("Hi! What's your name?") || "User";
      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<div class='bot-message'><img src='/static/IMG_2172.png' class='bot-avatar'><div><b>Bot:</b> Hello, ${userName}! How can I help you today?</div></div>`;
    };

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<div class='user-message'><img src='/static/IMG_2175.png' class='user-avatar'><div><b>${userName}:</b> ${message}</div></div>`;
      input.value = "";
      chatbox.scrollTop = chatbox.scrollHeight;

      const typingEl = document.createElement("div");
      typingEl.className = "typing-animation";
      typingEl.innerHTML = `<img src='/static/IMG_2172.png' class='bot-avatar'><span class='dot'></span><span class='dot'></span><span class='dot'></span>`;
      chatbox.appendChild(typingEl);
      chatbox.scrollTop = chatbox.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        typingEl.remove();
        chatbox.innerHTML += `<div class='bot-message'><img src='/static/IMG_2172.png' class='bot-avatar'><div><b>Bot:</b> ${data.response}</div></div>`;
      } catch (err) {
        typingEl.remove();
        chatbox.innerHTML += `<div class='bot-message'><img src='/static/IMG_2172.png' class='bot-avatar'><div><b>Bot:</b> Error contacting server.</div></div>`;
      }

      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
