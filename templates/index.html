<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlueBox – College AI Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>🎓 BlueBox</h1>
    <h2>Your AI Assistant for Colleges</h2>
    <p>Empower your institution with 24/7 instant student support. Let BlueBox handle FAQs, campus queries, admissions, and more.</p>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;" />

    <div id="chatbox"></div>

    <input type="text" id="userInput" placeholder="Type a question..." autofocus />
    <button onclick="sendMessage()">Send</button>

    <div class="contact">
      <p><strong>Interested in integrating BlueBox into your college?</strong></p>
      <p>Email us at <a href="mailto:bluebox2703@gmail.com">bluebox2703@gmail.com</a></p>
    </div>

    <div class="footer">
      &copy; 2025 BlueBox | AI Chatbots for Colleges
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<div><b>You:</b> ${message}</div>`;
      input.value = "";

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        chatbox.innerHTML += `<div><b>Bot:</b> ${data.response}</div>`;
      } catch (err) {
        chatbox.innerHTML += `<div><b>Bot:</b> Error contacting server.</div>`;
      }

      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
