<!DOCTYPE html>
<html>
<head>
  <title>BlueBox – College AI Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/static/IMG_2172.png" class="logo">
      <h1>BlueBox</h1>
    </div>

    <div id="welcome" class="welcome">
      <p>Hi! What’s your name?</p>
      <input type="text" id="nameInput" placeholder="Enter your name..." />
      <button onclick="setName()">Start Chat</button>
    </div>

    <div id="chatArea" class="hidden">
      <div id="chatbox"></div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask me anything..." autofocus />
        <button onclick="sendMessage()">Send</button>
      </div>

      <p class="contact">Contact: <a href="mailto:bluebox2703@gmail.com">bluebox2703@gmail.com</a></p>
    </div>
  </div>

  <script>
    let userName = "";

    function setName() {
      const nameField = document.getElementById("nameInput");
      userName = nameField.value.trim();
      if (!userName) return;

      document.getElementById("welcome").classList.add("hidden");
      document.getElementById("chatArea").classList.remove("hidden");

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `
        <div class="message bot">
          <img src="/static/IMG_2172.png" class="avatar">
          <div class="text">Hi ${userName}, how can I assist you today?</div>
        </div>`;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `
        <div class="message user">
          <img src="/static/IMG_2175.png" class="avatar">
          <div class="text">${message}</div>
        </div>`;
      input.value = "";

      // Bot typing indicator
      chatbox.innerHTML += `
        <div class="message bot typing" id="typing">
          <img src="/static/IMG_2172.png" class="avatar">
          <div class="text dots">
            <span>.</span><span>.</span><span>.</span>
          </div>
        </div>`;
      chatbox.scrollTop = chatbox.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        document.getElementById("typing").remove();

        chatbox.innerHTML += `
          <div class="message bot">
            <img src="/static/IMG_2172.png" class="avatar">
            <div class="text">${data.response}</div>
          </div>`;
      } catch (err) {
        document.getElementById("typing").remove();
        chatbox.innerHTML += `
          <div class="message bot">
            <img src="/static/IMG_2172.png" class="avatar">
            <div class="text">Error contacting server.</div>
          </div>`;
      }

      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
