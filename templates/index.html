<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LR.AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-container">

    <header>
      <img src="static/lr-ai-logo.png" class="logo" alt="LR.AI Logo">
      <h1>BlueBox</h1>
      <div class="toggle-container">
        <button id="dark-mode-toggle">🌙</button>
        <select id="language-select">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="ta">Tamil</option>
          <option value="bn">Bengali</option>
        </select>
      </div>
    </header>

    <div class="preloader-questions">
      <button onclick="sendPreloaded('What is the admission process?')">Admission Process</button>
      <button onclick="sendPreloaded('List of best private colleges in India')">Best Colleges</button>
      <button onclick="sendPreloaded('What are hostel facilities like?')">Hostel Facilities</button>
      <button onclick="sendPreloaded('What are the average fees?')">Fees</button>
      <button onclick="sendPreloaded('Are there scholarships available?')">Scholarships</button>
    </div>

    <div class="chat-window" id="chat-window"></div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
      <button id="voice-input" title="Voice Input">
        <img src="{{ url_for('static', filename='google-voice-icon.png') }}" alt="Voice" width="24" height="24">
      </button>
      <button onclick="resetChat()" class="reset-btn">🔄</button>
    </div>

    <form class="contact-form">
      <h3>Contact Us</h3>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>

    <footer>
      <p>© 2025 LR.AI | Contact: <a href="mailto:lr.ai.mi.ci@gmail.com">lr.ai.mi.ci@gmail.com</a></p>
    </footer>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    let speechSynthesisUtterance = null;

    function appendMessage(sender, text) {
      const msgContainer = document.createElement('div');
      msgContainer.classList.add('message', sender);

      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.src = sender === 'user' ? '/static/IMG_2175.png' : '/static/lr-ai-logo.png';

      const bubble = document.createElement('div');
      bubble.className = 'bubble typing';
      msgContainer.appendChild(avatar);
      msgContainer.appendChild(bubble);
      chatWindow.appendChild(msgContainer);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      setTimeout(() => {
        bubble.textContent = text;
        bubble.classList.remove('typing');
        if (sender === 'bot') speakText(text);
      }, 500);
    }

    function stopSpeaking() {
      if (speechSynthesis.speaking) speechSynthesis.cancel();
    }

    function speakText(text) {
      stopSpeaking();
      speechSynthesisUtterance = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(speechSynthesisUtterance);
    }

    function sendMessage() {
      stopSpeaking();
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      appendMessage('user', message);
      input.value = '';

      fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message, language: document.getElementById('language-select').value })
      })
      .then(res => res.json())
      .then(data => appendMessage('bot', data.reply));
    }

    function sendPreloaded(text) {
      document.getElementById('user-input').value = text;
      sendMessage();
    }

    function resetChat() {
      chatWindow.innerHTML = '';
    }

    document.addEventListener("click", stopSpeaking);
    document.getElementById("user-input").addEventListener("keydown", stopSpeaking);
    document.getElementById("dark-mode-toggle").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });
  </script>
</body>
</html>
