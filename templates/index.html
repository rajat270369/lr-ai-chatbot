<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlueBox</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-container">
    <header>
      <img src="/static/IMG_2172.png" class="logo" alt="BlueBox Logo">
      <h1>BlueBox</h1>
    </header>

    <div class="chat-window" id="chat-window"></div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');

    function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      appendMessage('user', message);
      input.value = '';
      setTimeout(() => {
        appendMessage('bot', "This is a placeholder response from BlueBox.");
      }, 800);
    }

    function appendMessage(sender, text) {
      const msgContainer = document.createElement('div');
      msgContainer.classList.add('message', sender);

      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.src = sender === 'user' ? '/static/IMG_2175.png' : '/static/IMG_2172.png';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      msgContainer.appendChild(avatar);
      msgContainer.appendChild(bubble);
      chatWindow.appendChild(msgContainer);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
  </script>
</body>
</html>
